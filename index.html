<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北海道家庭自駕 13 日遊</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans pb-20">

  <!-- 頂部 Header -->
  <header class="bg-gradient-to-r from-sky-600 to-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
          <span>🚗</span> 北海道秋季家庭自駕遊
        </h1>
        <p class="text-xs text-sky-100">10/22 (四) ~ 11/03 (二) · 13 天精彩環島</p>
      </div>
      <div class="text-right flex items-center gap-2">
        <button onclick="fetchAllWeather()" title="重新整理天氣" class="p-1.5 rounded-full bg-white/20 hover:bg-white/30 text-xs text-white transition">
          <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i>
        </button>
        <span class="inline-block bg-white/20 backdrop-blur-sm px-2.5 py-1 rounded-full text-xs font-medium">
          總車程 ~32.5h
        </span>
      </div>
    </div>

    <!-- 主分頁導覽列 (行程 vs 記帳) -->
    <div class="bg-sky-800/95 border-t border-sky-500/40">
      <div class="max-w-4xl mx-auto px-4 flex">
        <button id="tab-btn-itinerary" onclick="switchMainTab('itinerary')" class="flex-1 py-2.5 text-center text-xs md:text-sm font-bold border-b-2 border-white text-white flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-map-location-dot"></i> 行程總覽
        </button>
        <button id="tab-btn-expenses" onclick="switchMainTab('expenses')" class="flex-1 py-2.5 text-center text-xs md:text-sm font-semibold border-b-2 border-transparent text-sky-200 hover:text-white flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-wallet"></i> 記帳花費 <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>
        </button>
      </div>
    </div>

    <!-- 日期快速切換導覽列 (僅在行程分頁顯示) -->
    <div id="subnav-days" class="bg-sky-900/90 backdrop-blur border-t border-sky-700/50">
      <div id="day-nav" class="max-w-4xl mx-auto px-2 py-2 flex gap-2 overflow-x-auto no-scrollbar text-xs">
        <!-- 由 JS 動態生成 D1 - D13 按鈕 -->
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto px-4 pt-4">

    <!-- ==================== 分頁 1: 行程總覽 ==================== -->
    <section id="view-itinerary" class="space-y-6">
      <div id="itinerary-container" class="space-y-6">
        <!-- 由 JS 動態渲染行程卡片 -->
      </div>
    </section>

    <!-- ==================== 分頁 2: 記帳花費 ==================== -->
    <section id="view-expenses" class="hidden space-y-6">
      
      <!-- 花費總計面板 -->
      <div class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-5 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <p class="text-xs text-emerald-100 font-medium">整趟旅程累積總支出 (全團同步)</p>
              <button onclick="loadExpensesFromCloud()" title="手動同步最新金額" class="text-xs bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full transition inline-flex items-center gap-1">
                <i id="cloud-refresh-icon" class="fa-solid fa-rotate text-[10px]"></i> 同步
              </button>
            </div>
            <div class="flex items-baseline gap-2 mt-1">
              <span class="text-2xl md:text-3xl font-extrabold" id="total-jpy">¥0</span>
              <span class="text-xs text-emerald-200" id="total-twd">(約 NT$ 0)</span>
            </div>
          </div>
          <!-- 匯率自訂 -->
          <div class="flex items-center gap-1.5 bg-white/20 backdrop-blur px-3 py-2 rounded-xl text-xs text-emerald-50">
            <span>1 JPY ≈</span>
            <input type="number" id="exchange-rate-input" step="0.001" min="0.01" max="1" 
                   onchange="updateExchangeRate(this.value)"
                   class="w-16 bg-white/90 text-slate-800 font-bold px-1.5 py-0.5 rounded text-center outline-none focus:ring-2 focus:ring-white" />
            <span>TWD</span>
          </div>
        </div>
      </div>

      <!-- 快速記帳表單 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5">
        <h3 class="text-sm md:text-base font-bold text-slate-800 flex items-center gap-2 mb-3">
          <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i> 新增支出項目 (同步至雲端)
        </h3>
        <form id="expense-form" onsubmit="addExpense(event)" class="grid grid-cols-1 md:grid-cols-12 gap-3 text-xs md:text-sm">
          <div class="md:col-span-2">
            <label class="block text-slate-500 mb-1 font-medium">日期</label>
            <select id="exp-day" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500">
              <!-- JS 動態生成 D1 - D13 選項 -->
            </select>
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-500 mb-1 font-medium">類別</label>
            <select id="exp-category" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500">
              <option value="住宿">🏨 住宿</option>
              <option value="美食">🍜 美食餐飲</option>
              <option value="購物">🛍️ 購物採買</option>
              <option value="交通">⛽ 交通/加油/停車</option>
              <option value="門票">🎟️ 門票活動</option>
              <option value="其他">📦 其他雜項</option>
            </select>
          </div>
          <div class="md:col-span-4">
            <label class="block text-slate-500 mb-1 font-medium">項目明細說明</label>
            <input type="text" id="exp-desc" placeholder="例：大黑屋烤肉、AEON超市" required
                   class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500" />
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-500 mb-1 font-medium">日幣金額 (¥)</label>
            <div class="flex gap-2">
              <input type="number" id="exp-amount" placeholder="0" min="1" required
                     class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500" />
              <button type="submit" id="submit-exp-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg transition whitespace-nowrap">
                新增
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- 每日花費摺疊/展開卡片清單 -->
      <div id="expense-days-container" class="space-y-4">
        <!-- JS 動態生成各天消費記錄 -->
      </div>

    </section>

  </main>

    let JPY_TO_TWD = parseFloat(localStorage.getItem("hokkaido_fx_rate")) || 0.215;

      const parsed = parseFloat(val);
      if (!isNaN(parsed) && parsed > 0) {
        JPY_TO_TWD = parsed;
        localStorage.setItem("hokkaido_fx_rate", JPY_TO_TWD);
        renderExpenses();
      }

    // 從 Google Apps Script 雲端同步抓取
    async function loadExpensesFromCloud() {
      if (!CLOUD_API_URL) {
        renderExpenses();
        return;
      }
      const icon = document.getElementById("cloud-refresh-icon");
      if (icon) icon.classList.add("fa-spin");
      try {
        const res = await fetch(CLOUD_API_URL);
        const json = await res.json();
        if (json.status === "success" && Array.isArray(json.data) && json.data.length > 0) {
          expenses = json.data;
          localStorage.setItem("hokkaido_expenses", JSON.stringify(expenses));
          document.getElementById("sync-status-dot").className = "w-2 h-2 rounded-full bg-emerald-400 inline-block";
        }
      } catch (err) {
        console.warn("雲端讀取失敗，使用本機資料", err);
        document.getElementById("sync-status-dot").className = "w-2 h-2 rounded-full bg-amber-400 inline-block";
      } finally {
        if (icon) setTimeout(() => icon.classList.remove("fa-spin"), 500);
        renderExpenses();
      }
    }

    // 儲存（本機 + 雲端非同步上傳）
    async function saveExpenses(actionType, payload) {
      localStorage.setItem("hokkaido_expenses", JSON.stringify(expenses));
      renderExpenses();

      if (!CLOUD_API_URL) return;

      try {
        await fetch(CLOUD_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: actionType, ...payload })
        });
      } catch (err) {
        console.error("雲端同步失敗", err);
      }
    }

    async function addExpense(e) {
      e.preventDefault();
      const day = document.getElementById("exp-day").value;
      const category = document.getElementById("exp-category").value;
      const desc = document.getElementById("exp-desc").value.trim();
      const amount = parseInt(document.getElementById("exp-amount").value, 10);

      if (!desc || isNaN(amount) || amount <= 0) return;

      const newItem = {
        id: Date.now(),
        day,
        category,
        desc,
        amount
      };

      expenses.push(newItem);
      document.getElementById("exp-desc").value = "";
      document.getElementById("exp-amount").value = "";
      
      await saveExpenses("add", { item: newItem });
    }

    async function deleteExpense(id) {
      if (confirm("確定要刪除這筆花費紀錄嗎？（所有人皆會同步刪除）")) {
        expenses = expenses.filter(item => String(item.id) !== String(id));
        await saveExpenses("delete", { id: id });
      }
    }

    function getWeatherDesc(code) {
      if (code === 0) return { text: "晴朗", icon: "fa-sun text-amber-500" };
      if ([1, 2, 3].includes(code)) return { text: "晴時多雲", icon: "fa-cloud-sun text-sky-500" };
      if ([45, 48].includes(code)) return { text: "起霧", icon: "fa-smog text-slate-400" };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { text: "有雨", icon: "fa-cloud-showers-heavy text-blue-500" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: "降雪", icon: "fa-snowflake text-indigo-400" };
      if ([95, 96, 99].includes(code)) return { text: "雷雨", icon: "fa-bolt text-amber-600" };
      return { text: "多雲", icon: "fa-cloud text-slate-400" };
    }

    async function fetchWeatherForDay(item) {
      const weatherDom = document.getElementById(`weather-${item.day}`);
      if (!weatherDom) return;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("API failed");
        const data = await res.json();

        const current = data.current;
        const daily = data.daily;
        const weatherInfo = getWeatherDesc(current.weather_code);

        const curTemp = Math.round(current.temperature_2m);
        const maxTemp = Math.round(daily.temperature_2m_max[0]);
        const minTemp = Math.round(daily.temperature_2m_min[0]);
        const rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;

        weatherDom.innerHTML = `
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold">
              <i class="fa-solid fa-signal text-[9px]"></i> 即時連線
            </span>
            <span class="inline-flex items-center gap-1 font-semibold text-sky-900">
              <i class="fa-solid ${weatherInfo.icon}"></i> ${weatherInfo.text}
            </span>
            <span class="font-bold text-slate-800 text-sm">${curTemp}°C</span>
            <span class="text-slate-500 text-xs">(${minTemp}°C ~ ${maxTemp}°C)</span>
            ${rainProb !== null ? `<span class="text-blue-600 text-xs font-medium"><i class="fa-solid fa-umbrella text-[10px]"></i> 降雨率 ${rainProb}%</span>` : ''}
          </div>
        `;
      } catch (err) {
        weatherDom.innerHTML = `
          <div class="flex items-center gap-1.5 text-slate-600">
            <i class="fa-solid fa-cloud-sun text-sky-500"></i>
            <span><strong>氣候參考：</strong>${item.weatherFallback}</span>
          </div>
        `;
      }
    }

        return `
          <div class="relative pl-6 pb-4 border-l-2 border-sky-200 last:border-transparent last:pb-0">
            <span class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-sky-500 ring-4 ring-sky-100"></span>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
              <div class="flex items-center justify-between gap-2">
                <h4 class="font-semibold text-slate-800 text-sm md:text-base">${stop.name}</h4>
                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-1 text-xs px-2.5 py-1 bg-white hover:bg-sky-50 text-sky-600 border border-sky-300 rounded-lg shadow-2xs font-medium transition shrink-0">
                  <i class="fa-solid fa-location-dot text-red-500"></i> 地圖/評論
                </a>
              </div>
              ${stop.note ? `<p class="text-xs text-slate-600 mt-1">${stop.note}</p>` : ''}
            </div>
          </div>
        `;
      }).join("");

      let foodHtml = "";
      if (item.food && item.food.length > 0) {
        foodHtml = `
          <div class="mt-4 pt-4 border-t border-slate-100">
            <div class="text-xs font-bold text-slate-500 mb-2 flex items-center gap-1">
              <i class="fa-solid fa-utensils text-orange-500"></i> 當日重點美食推介
            </div>
            <div class="space-y-2">
              ${item.food.map(f => `
                <div class="flex items-center justify-between bg-orange-50/60 border border-orange-100 px-3 py-2 rounded-xl">
                  <span class="text-xs md:text-sm font-medium text-slate-800">${f.name}</span>
                  <a href="${f.url}" target="_blank" rel="noopener noreferrer"
                     class="text-xs bg-white text-orange-600 border border-orange-200 hover:bg-orange-100 px-2 py-1 rounded-md font-medium shrink-0">
                    查看菜單/評價 ➔
                  </a>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="p-4 md:p-5 border-b border-slate-100 bg-gradient-to-r from-sky-50/60 to-white">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-sky-600 text-white font-bold text-sm shadow-xs">${item.day}</span>
              <span class="text-sm font-semibold text-slate-600">${item.date}</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200/70 text-slate-700">${item.area}</span>
            </div>
            <div class="flex items-center gap-3 text-xs text-slate-600">
              <span class="inline-flex items-center gap-1 font-medium bg-amber-100/70 text-amber-900 px-2 py-1 rounded-md">
                <i class="fa-solid fa-car text-amber-600"></i> ${item.driveTime}
              </span>
            </div>
          </div>
          <h3 class="text-base md:text-lg font-bold text-slate-800 mt-2">${item.title}</h3>
          
          <div id="weather-${item.day}" class="mt-2 text-xs bg-sky-50 border border-sky-200/70 px-3 py-2 rounded-lg min-h-[38px] flex items-center">
            <span class="text-slate-400 inline-flex items-center gap-1.5"><i class="fa-solid fa-spinner fa-spin"></i> 正在連線更新 ${item.area} 即時氣候...</span>
          </div>

          <div class="flex flex-wrap gap-1.5 mt-2.5">
            ${badgeList.join("")}
          </div>
        </div>

        <div class="p-4 md:p-5 space-y-4">
          <div class="text-xs text-slate-600 bg-slate-100/80 p-2.5 rounded-lg leading-relaxed">
            <span class="font-semibold text-slate-700">📍 細部路程節點：</span>${item.routeRaw}
          </div>

          <div>
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">當日行經景點與放電地標</h4>
            <div class="space-y-1">
              ${stopsHtml}
            </div>
          </div>

          ${foodHtml}

          ${item.hotel && item.hotel.url ? `
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between bg-indigo-50/50 border border-indigo-100 p-3 rounded-xl">
              <div>
                <div class="text-xs text-indigo-600 font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-bed"></i> 當晚下榻
                </div>
                <div class="text-sm font-bold text-slate-800 mt-0.5">${item.hotel.name}</div>
              </div>
              <a href="${item.hotel.url}" target="_blank" rel="noopener noreferrer"
                 class="text-xs px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-xs font-medium transition">
                導航至飯店
              </a>
            </div>
          ` : ''}

          ${item.note ? `
            <div class="text-xs text-amber-800 bg-amber-50/80 border border-amber-200 p-2.5 rounded-lg flex items-start gap-1.5">
              <i class="fa-solid fa-circle-exclamation mt-0.5 text-amber-600"></i>
              <span><strong>備註提醒：</strong>${item.note}</span>
            </div>
          ` : ''}
        </div>
      `;
      container.appendChild(card);
    });

    window.addEventListener("DOMContentLoaded", () => {
      fetchAllWeather();
      loadExpensesFromCloud();
    });
  </script>
</body>
</html>
